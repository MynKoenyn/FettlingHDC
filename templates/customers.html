<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customers - Fettling</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <div class="nav-container">
            <h1>Customers</h1>
            <nav>
                <a href="{{ url_for('dashboard') }}">Dashboard</a>
                <a href="{{ url_for('logout') }}">Logout</a>
            </nav>
        </div>
    </header>

    <div class="container">
        <div class="grid-2">
            <div class="card" >
                <div class="card-inner" style="width: 80%;">
                <h2>Add New Customer</h2>
                <form method="POST">
                    {{ form.hidden_tag() }}
                    <div class="form-group">
                        {{ form.name.label }}
                        {{ form.name(class="form-control", placeholder="Enter customer name") }}
                    </div>
                    {{ form.submit(class="btn btn-primary") }}
                </form>
                </div>
            </div>
            </div>
            <div class="card">
                
                <table>
                    <thead>
                        <tr>
                            
                            <th data-sort="text">Customer Name <i class="fas fa-sort ms-1"></i></th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for s in customers %}
                        <tr>
                            
                            <td>{{ s.name }}</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
