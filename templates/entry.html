<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Entry</title>
    <style>
        body { font-family: sans-serif; margin: 2rem; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        .btn { padding: 0.5rem 1rem; background: #6c757d; color: white; text-decoration: none; border-radius: 4px; }
        
        .global-date { margin-bottom: 2rem; padding: 1rem; background: #f8f9fa; border-radius: 4px; }
        
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 0.5rem; }
        th { background-color: #e9ecef; }
        
        select, input { width: 100%; padding: 0.3rem; box-sizing: border-box; }
        
        .submit-container { margin-top: 2rem; text-align: right; }
        .btn-submit { background: #28a745; padding: 1rem 2rem; font-size: 1.1rem; border: none; cursor: pointer; color: white; border-radius: 4px; }
        .btn-submit:hover { background: #218838; }
    </style>
</head>
<body>
    <header>
        <h1>Daily Fettling Entry</h1>
        <a href="{{ url_for('dashboard') }}" class="btn">Back to Dashboard</a>
    </header>

    <form method="POST">
        <div class="global-date">
            <label><strong>Global Date:</strong></label>
            <input type="date" name="entry_date" value="{{ today }}" required style="width: auto; margin-left: 1rem;">
        </div>

        <table>
            <thead>
                <tr>
                    <th style="width: 5%">Line</th>
                    <th style="width: 35%">Supplier</th>
                    <th style="width: 35%">Product</th>
                    <th style="width: 25%">Quantity</th>
                </tr>
            </thead>
            <tbody>
                {% for i in range(1, 51) %}
                <tr>
                    <td>{{ i }}</td>
                    <td>
                        <select name="supplier_{{ i }}" onchange="filterProducts({{ i }})">
                            <option value="">Select Supplier...</option>
                            {% for supplier in suppliers %}
                            <option value="{{ supplier[0] }}">{{ supplier[1] }}</option>
                            {% endfor %}
                        </select>
                    </td>
                    <td>
                        <select name="product_id_{{ i }}" id="product_select_{{ i }}" disabled>
                            <option value="">Select Supplier First</option>
                        </select>
                    </td>
                    <td>
                        <input type="number" name="quantity_{{ i }}" min="0">
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

        <div class="submit-container">
            <button type="submit" class="btn-submit">Save Entries</button>
        </div>
    </form>

    <script>
        // Parse the products data passed from Flask
        const productsBySupplier = JSON.parse('{{ products_by_supplier | safe }}');

        function filterProducts(rowIndex) {
            const supplierSelect = document.querySelector(`select[name="supplier_${rowIndex}"]`);
            const productSelect = document.getElementById(`product_select_${rowIndex}`);
            const supplierId = supplierSelect.value;

            // Clear existing options
            productSelect.innerHTML = '<option value="">Select Product...</option>';
            
            if (supplierId && productsBySupplier[supplierId]) {
                productSelect.disabled = false;
                
                // Add new options
                productsBySupplier[supplierId].forEach(product => {
                    const option = document.createElement('option');
                    option.value = product.id;
                    option.textContent = product.name;
                    productSelect.appendChild(option);
                });
            } else {
                productSelect.disabled = true;
                if (!supplierId) {
                    productSelect.innerHTML = '<option value="">Select Supplier First</option>';
                } else {
                    productSelect.innerHTML = '<option value="">No products found</option>';
                }
            }
        }
    </script>
</body>
</html>
