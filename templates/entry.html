<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Entry</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .global-date { margin-bottom: 2rem; padding: 1.5rem; background: #f8fafc; border-radius: 0.75rem; border: 1px solid #e2e8f0; }
        .submit-container { margin-top: 2rem; text-align: right; }
        .line-col { width: 60px; text-align: center; }
    </style>
</head>
<body>
    <header>
        <div class="nav-container">
            <h1>Daily Entry</h1>
            <nav>
                <a href="{{ url_for('dashboard') }}">Dashboard</a>
                <a href="{{ url_for('logout') }}">Logout</a>
            </nav>
        </div>
    </header>

    <div class="container">
        <form method="POST" class="card">
            <div class="global-date">
                <div class="form-group" style="margin-bottom: 0; display: flex; align-items: center; gap: 1rem;">
                    <label style="margin-bottom: 0;"><strong>Global Entry Date:</strong></label>
                    <input type="date" name="entry_date" value="{{ today }}" required style="width: auto;">
                </div>
            </div>

            <table>
                <thead>
                    <tr>
                        <th class="line-col">#</th>
                        <th>Supplier</th>
                        <th>Product</th>
                        <th style="width: 150px;">Quantity</th>
                    </tr>
                </thead>
            <tbody>
                {% for i in range(1, 51) %}
                <tr>
                    <td>{{ i }}</td>
                    <td>
                        <select name="supplier_{{ i }}" onchange="filterProducts({{ i }})">
                            <option value="">Select Supplier...</option>
                            {% for supplier in suppliers %}
                            <option value="{{ supplier[0] }}">{{ supplier[1] }}</option>
                            {% endfor %}
                        </select>
                    </td>
                    <td>
                        <select name="product_id_{{ i }}" id="product_select_{{ i }}" disabled>
                            <option value="">Select Supplier First</option>
                        </select>
                    </td>
                    <td>
                        <input type="number" name="quantity_{{ i }}" min="0">
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

        <div class="submit-container">
            <button type="submit" class="btn-submit">Save Entries</button>
        </div>
    </form>

    <script>
        // Parse the products data passed from Flask
        const productsBySupplier = JSON.parse('{{ products_by_supplier | safe }}');

        function filterProducts(rowIndex) {
            const supplierSelect = document.querySelector(`select[name="supplier_${rowIndex}"]`);
            const productSelect = document.getElementById(`product_select_${rowIndex}`);
            const supplierId = supplierSelect.value;

            // Clear existing options
            productSelect.innerHTML = '<option value="">Select Product...</option>';
            
            if (supplierId && productsBySupplier[supplierId]) {
                productSelect.disabled = false;
                
                // Add new options
                productsBySupplier[supplierId].forEach(product => {
                    const option = document.createElement('option');
                    option.value = product.id;
                    option.textContent = product.name;
                    productSelect.appendChild(option);
                });
            } else {
                productSelect.disabled = true;
                if (!supplierId) {
                    productSelect.innerHTML = '<option value="">Select Supplier First</option>';
                } else {
                    productSelect.innerHTML = '<option value="">No products found</option>';
                }
            }
        }
    </script>
</body>
</html>
