{% extends "base.html" %}

{% block extra_head %}
{% block fettling_head %}{% endblock %}
{% endblock %}

{% block content %}
<div class="hdc-subnav">
    <div class="hdc-subnav-inner">
        <div class="hdc-breadcrumb">
            <a href="{{ url_for('fettling.dashboard') }}" style="color: inherit; text-decoration: none; display: inline-flex; align-items: center; gap: .35rem;">
                <i class="bi bi-tools"></i> Fettling
            </a>
            {% block fettling_crumb %}{% endblock %}
        </div>
        <div class="hdc-subnav-links">
            <a href="{{ url_for('fettling.dashboard') }}" class="{{ 'active' if request.endpoint == 'fettling.dashboard' }}"><i class="bi bi-speedometer2"></i> Dashboard</a>
            <a href="{{ url_for('fettling.entry') }}" class="{{ 'active' if request.endpoint == 'fettling.entry' }}"><i class="bi bi-pencil-square"></i> New Entry</a>
            <a href="{{ url_for('fettling.report') }}" class="{{ 'active' if request.endpoint == 'fettling.report' }}"><i class="bi bi-bar-chart"></i> Reports</a>
        </div>
    </div>
</div>
<div class="app-container wide">
{% block fettling_content %}{% endblock %}
</div>
{% endblock %}
