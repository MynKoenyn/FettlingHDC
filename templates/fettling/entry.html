<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Entry - Fettling</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<!-- Select2 CSS -->
<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
<style>
.global-date { margin-bottom: 2rem; padding: 1.5rem; background: #f8fafc; border-radius: 0.75rem; border: 1px solid #e2e8f0; }
.submit-container { margin-top: 2rem; text-align: right; }
.line-col { width: 60px; text-align: center; }
table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
th, td { border: 1px solid #e2e8f0; padding: 0.5rem; text-align: left; }
th { background-color: #f1f5f9; }
.select2-container { width: 100% !important; }
</style>
</head>
<body>
<header>
    <div class="nav-container">
        <h1>Daily Entry</h1>
        <nav>
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="{{ url_for('logout') }}">Logout</a>
        </nav>
    </div>
</header>

<div class="container">
    <form method="POST" class="card" style="width: 1400px; margin: 2rem auto;">
        <div class="card-inner">
        {{ form.hidden_tag() }}

        <div class="global-date">
            <div class="form-group" style="margin-bottom: 0; display: flex; align-items: center; gap: 1rem;">
                <label style="margin-bottom: 0;"><strong>Global Entry Date:</strong></label>
                {{ form.entry_date(class="form-control", value=today) }}
            </div>
        </div>

        <table>
            <thead>
            <tr>
                <th class="line-col">#</th>
                <th>Customer</th>
                <th>Product</th>
                <th style="width: 150px;">Quantity</th>
            </tr>
            </thead>
            <tbody>
            {% for i in range(1, 51) %}
            <tr>
                <td>{{ i }}</td>
                <td>
                    <select name="customer_{{ i }}" class="customer-select" data-row="{{ i }}">
                        <option value="">Select Customer...</option>
                        {% for customer in customers %}
                        <option value="{{ customer.id }}">{{ customer.name }}</option>
                        {% endfor %}
                    </select>
                </td>
                <td>
                    <select name="product_id_{{ i }}" id="product_select_{{ i }}" class="product-select" disabled>
                        <option value="">Select Customer First</option>
                    </select>
                </td>
                <td>
                    <input type="number" name="quantity_{{ i }}" min="0">
                </td>
            </tr>
            {% endfor %}
            </tbody>
        </table>

        <div class="submit-container">
            {{ form.submit(class="btn-submit") }}
        </div>
        </div>
        </form>
    
</div>

<!-- JS dependencies -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<script>
const productsBySupplier = JSON.parse('{{ products_by_customer | safe }}');

// Initialize Select2 for all product selects
function initSelect2(rowIndex) {
    const productSelect = $(`#product_select_${rowIndex}`);
    productSelect.select2({
        placeholder: "Select Product...",
        allowClear: true,
        width: 'resolve',
        matcher: function(params, data) {
            if ($.trim(params.term) === '') return data; // show all when empty
            if (data.text.toLowerCase().includes(params.term.toLowerCase())) return data;
            return null;
        }
    });
}

// Update product dropdown when customer changes
$('.customer-select').on('change', function() {
    const rowIndex = $(this).data('row');
    const customerId = $(this).val();
    const productSelect = $(`#product_select_${rowIndex}`);

    productSelect.empty().trigger('change'); // clear old options

    if (customerId && productsBySupplier[customerId]) {
        // Enable select
        productSelect.prop('disabled', false);

        // Add products
        const products = productsBySupplier[customerId];
        products.forEach(p => {
            const newOption = new Option(p.name, p.id, false, false);
            productSelect.append(newOption);
        });

    } else {
        productSelect.prop('disabled', true);
        const placeholder = !customerId ? "Select Customer First" : "No products found";
        const newOption = new Option(placeholder, '', false, false);
        productSelect.append(newOption);
    }

    initSelect2(rowIndex);
});

// Initialize all product selects on page load
{% for i in range(1, 51) %}
initSelect2({{ i }});
{% endfor %}
</script>
</body>
</html>
