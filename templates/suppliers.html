<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suppliers - Fettling</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <div class="nav-container">
            <h1>Suppliers</h1>
            <nav>
                <a href="{{ url_for('dashboard') }}">Dashboard</a>
                <a href="{{ url_for('logout') }}">Logout</a>
            </nav>
        </div>
    </header>

    <div class="container">
        <div class="grid-2">
            <div class="card">
                <h2>Add New Supplier</h2>
                <form method="POST">
                    <div class="form-group">
                        <label>Supplier Name</label>
                        <input type="text" name="name" required placeholder="Enter supplier name">
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%">Create Supplier</button>
                </form>
            </div>

            <div class="card">
                <h2>All Suppliers</h2>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for s in suppliers %}
                        <tr>
                            <td>{{ s[0] }}</td>
                            <td>{{ s[1] }}</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
